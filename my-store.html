<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis · My Store</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/identity.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/store.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data/supabase-config.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>

<div id="myStoreApp" class="hidden-app">

    <main class="store-page">
        <div class="fs-topbar">
            <a href="index.html" class="fs-menu" style="text-decoration:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </a>
            <span class="fs-topbar-title">My Store</span>

            <div class="fs-section-switcher" :class="{ open: sectionSwitcherOpen }">
                <button class="fs-section-btn" type="button" @click.stop="sectionSwitcherOpen = !sectionSwitcherOpen">
                    <span>My Store</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6"/>
                    </svg>
                </button>
                <div class="fs-section-menu">
                    <a class="fs-section-item" href="admin.html" v-if="canAccessAdmin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3.5 4 7v5c0 5 3.5 8 8 9 4.5-1 8-4 8-9V7z"/>
                            <path d="M9 12l2 2 4-4"/>
                        </svg>
                        <span>Admin panel</span>
                    </a>
                    <a class="fs-section-item" href="index.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v18H5.5A1.5 1.5 0 0 1 4 19.5z"/>
                            <path d="M4 17.5A1.5 1.5 0 0 1 5.5 16H20"/>
                        </svg>
                        <span>Courses</span>
                    </a>
                    <a class="fs-section-item" href="secrets.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
                            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
                        </svg>
                        <span>Secrets</span>
                    </a>
                    <a class="fs-section-item" href="store.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 8h14l-1.2 12H6.2z"/>
                            <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
                        </svg>
                        <span>Store</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="store-body">
            <p v-if="loading" class="store-empty">Loading…</p>

            <template v-else>
                <div class="store-edit-section">
                    <label class="store-edit-label">Card image</label>
                    <div class="store-card-image-edit" @click="triggerCardImage">
                        <img v-if="cardImageUrl" :src="cardImageUrl" alt="">
                        <div v-else class="empty-hint">Click to upload a card image</div>
                    </div>
                    <input type="file" ref="cardImageInput" accept="image/*" hidden @change="uploadCardImage">
                </div>

                <div class="store-edit-section">
                    <label class="store-edit-label">Store name</label>
                    <input class="store-edit-input" v-model="nombre" @change="saveStore">
                </div>

                <div class="store-edit-section">
                    <label class="store-edit-label">Description</label>
                    <textarea class="store-edit-textarea" v-model="descripcion"
                              placeholder="Describe your business…" @change="saveStore"></textarea>
                </div>

                <div class="store-edit-section">
                    <label class="store-edit-label">Photos</label>
                    <div class="store-photos-grid">
                        <div v-for="p in photos" :key="p.id" class="store-photo-item">
                            <img :src="p.url" alt="">
                            <button class="store-photo-delete" @click="deletePhoto(p)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
                            </button>
                        </div>
                        <button class="store-add-photo-btn" @click="triggerPhotoUpload">
                            <span class="material-icons">add_photo_alternate</span>
                            <span>Add photo</span>
                        </button>
                    </div>
                    <input type="file" ref="photoInput" accept="image/*" multiple hidden @change="uploadPhotos">
                </div>

                <div class="store-actions">
                    <button class="store-btn" @click="toggleEnabled">
                        {{ enabled ? 'Hide store' : 'Show store' }}
                    </button>
                    <button class="store-btn primary" @click="saveStore">Save</button>
                </div>
            </template>
        </div>
    </main>
</div>

<div class="login-screen" id="loginScreen">
    <div class="login-sheet">
        <div class="login-form-wrap">
            <h2 class="login-form-title">Sign In</h2>
            <div class="login-field">
                <label class="login-field-label" for="loginUserInput">USERNAME</label>
                <input type="text" id="loginUserInput" class="login-field-input" placeholder="yourname" autocomplete="username">
            </div>
            <div class="login-field">
                <label class="login-field-label" for="loginPassInput">PASSWORD</label>
                <div class="login-field-password">
                    <input type="password" id="loginPassInput" class="login-field-input" placeholder="••••••" autocomplete="current-password">
                </div>
                <label class="login-remember"><input type="checkbox" id="loginRemember"><span>Keep me signed in</span></label>
            </div>
            <p class="login-error-msg" id="loginErrorMsg" style="display:none;">Wrong username or password</p>
            <button class="login-btn" id="loginSubmitBtn" type="button">Sign In</button>
        </div>
    </div>
</div>

<script src="js/shared/config.js"></script>
<script src="js/shared/utils.js"></script>
<script src="js/shared/auth.js"></script>
<script src="js/shared/data.js"></script>
<script src="js/shared/ui.js"></script>
<script src="js/components/PhotoSlot.js"></script>
<script src="js/my-store.js?v=1"></script>
</body>
</html>
