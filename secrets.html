<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis · Secrets</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="identity.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="secrets-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data/supabase-config.js?v=4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>

<div id="secretsApp" class="hidden-app">

    <header class="secrets-topbar">
        <a href="index.html" class="secrets-back" title="Back to Oasis">
            <span class="material-icons">arrow_back</span>
        </a>
        <h1 class="secrets-title">Secrets</h1>
        <div class="secrets-topbar-right">
            <div class="secrets-user" v-if="currentUser">
                <img v-if="currentUserPhoto" :src="currentUserPhoto" class="secrets-user-avatar" alt="">
                <div v-else class="secrets-user-avatar no-photo-fallback">{{ currentUserInitial }}</div>
                <span class="secrets-user-name">{{ currentUser.nombre }}</span>
            </div>
            <button class="secrets-signout" @click="signOut" title="Sign out">
                <span class="material-icons">logout</span>
            </button>
        </div>
    </header>

    <main class="secrets-feed" ref="feed">
        <p v-if="loading" class="secrets-empty">Loading…</p>
        <p v-else-if="messages.length === 0" class="secrets-empty">No secrets yet. Be the first.</p>

        <div v-for="m in messages" :key="m.id" class="discord-msg">
            <div class="discord-avatar">
                <img v-if="!m.anonimo && studentFoto(m.autor_id)" :src="studentFoto(m.autor_id)" alt="">
                <img v-else-if="m.anonimo" :src="ANON_AVATAR" alt="">
                <div v-else class="discord-avatar-fallback">{{ (m.autor_nombre || "?")[0] }}</div>
            </div>
            <div class="discord-body">
                <div class="discord-head">
                    <span class="discord-author" :class="{ 'is-anon': m.anonimo }">
                        {{ m.anonimo ? "Anonymous" : (m.autor_nombre || "Someone") }}
                    </span>
                    <span class="discord-date">{{ formatDateTime(m.fecha) }}</span>
                </div>
                <div class="discord-text" v-html="renderMarkdown(m.mensaje)"></div>
            </div>
            <button v-if="canDelete(m)" class="discord-delete" @click="deleteMsg(m)" title="Delete">
                <span class="material-icons">delete</span>
            </button>
        </div>
    </main>

    <div class="secrets-compose">
        <div class="compose-inner">
            <label class="compose-anon">
                <input type="checkbox" v-model="anonimo">
                <span>Anonymus</span>
            </label>
            <textarea
                v-model="texto"
                placeholder="Share a secret… (Enter to send, Shift+Enter for newline)"
                rows="1"
                @keydown.enter.exact.prevent="send"
                @input="autoGrow"
                ref="ta"></textarea>
            <button class="compose-send" @click="send" :disabled="sending || !texto.trim()">
                <span class="material-icons">{{ sending ? "hourglass_empty" : "send" }}</span>
            </button>
        </div>
    </div>

</div>

<div class="login-screen" id="loginScreen">
    <h1 class="login-wordmark">Oasis</h1>
    <div class="login-sheet">
        <div class="login-form-wrap">
            <h2 class="login-form-title">Sign In</h2>
            <div class="login-field">
                <label class="login-field-label" for="loginUserInput">USERNAME</label>
                <input type="text" id="loginUserInput" class="login-field-input" placeholder="yourname" autocomplete="username">
            </div>
            <div class="login-field">
                <label class="login-field-label" for="loginPassInput">PASSWORD</label>
                <div class="login-field-password">
                    <input type="password" id="loginPassInput" class="login-field-input"
                        placeholder="••••••" autocomplete="current-password">
                    <button type="button" class="login-field-eye" data-target="loginPassInput" aria-label="Show password">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3l18 18"/>
                            <path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.4 4.3"/>
                            <path d="M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4.4-1"/>
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="login-error-msg" id="loginErrorMsg" style="display:none;">Wrong username or password</p>
            <button class="login-btn" id="loginSubmitBtn" type="button">Sign In</button>
        </div>
    </div>
</div>

<script>
/* Password visibility toggle (fuera de Vue) */
document.querySelectorAll('.login-field-eye').forEach(btn => {
    btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.classList.toggle('is-visible', show);
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
});
</script>

<script src="secrets.js?v=1"></script>
</body>
</html>
